name: Publish to PyPI

# Fires when you publish a GitHub release, e.g. tag v0.1.0.
# Before the first run, register the trusted publisher on PyPI:
#   https://pypi.org/manage/account/publishing/
#   owner/repo = wyzzz12548/structdiff, workflow = publish.yml, environment = pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/structdiff
    permissions:
      id-token: write # trusted publishing, no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
